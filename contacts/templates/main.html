<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин - Главная</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    <style>
        .menu-fixed {
            min-height: 100vh;
            border-right: 1px solid #ddd;
        }

        .product-card {
            min-height: 200px;  /* можно поменять внизу */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Левая колонка Меню (уже в 1.5 раза: col-md-2 вместо col-md-3 ) -->
            <div class="col-md-2 menu-fixed bg-light d-flex flex-column">
                <div class="p-3 flex-grow-1">
                    <h4 class="fw-bold">Меню</h4>
                    <nav>
                        <ul class="nav flex-column">
                            <li class="nav-item mb-2">
                                <a href="index.html" class="nav-link active">Главная</a>
                            </li>
                            <li class="nav-item mb-2">
                                <a href="catalog.html" class="nav-link">Каталог</a>
                            </li>
                            <li class="nav-item mb-2">
                                <a href="cart.html" class="nav-link">Корзина</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- Центральная часть страницы -->
            <div class="col-md-10">
                <div class="p-4">
                    <h1 class="text-center mb-4">Главная</h1>

                    <div class="row gy-4">
                        <!-- Карточка 1 -->
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="card product-card">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                                    <p class="card-text mb-0">Товар 1</p>
                                    <button class="btn btn-primary mt-2">Купить</button>
                                </div>
                            </div>
                        </div>

                        <!-- Карточка 2 -->
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="card product-card">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                                    <p class="card-text mb-0">Товар 1</p>
                                    <button class="btn btn-primary mt-2">Купить</button>
                                </div>
                            </div>
                        </div>

                        <!-- Карточка 3 -->
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="card product-card">
                                <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
                                    <p class="card-text mb-0">Товар 1</p>
                                    <button class="btn btn-primary mt-2">Купить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
